<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Agent 知识网络（v0）</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0b1020;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-2: rgba(255, 255, 255, 0.085);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.9);
        --muted: rgba(255, 255, 255, 0.65);
        --muted2: rgba(255, 255, 255, 0.45);
        --accent: #7dd3fc;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--sans);
        background: radial-gradient(1200px 800px at 18% 12%, rgba(125, 211, 252, 0.17), transparent 55%),
          radial-gradient(900px 700px at 88% 22%, rgba(167, 139, 250, 0.16), transparent 55%),
          radial-gradient(900px 700px at 70% 88%, rgba(74, 222, 128, 0.14), transparent 55%),
          var(--bg);
        color: var(--text);
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        padding: 18px 18px 12px;
        display: grid;
        gap: 10px;
      }

      .titleRow {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.2px;
      }

      .sub {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: none;
        font-size: 12px;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      button:active {
        transform: translateY(1px);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
      }

      .search {
        display: grid;
        grid-template-columns: 1fr;
      }

      input[type="search"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        outline: none;
      }

      input[type="search"]:focus {
        border-color: rgba(125, 211, 252, 0.5);
        box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.14);
      }

      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }

      .chip input {
        margin: 0;
      }

      main {
        padding: 12px 18px 18px;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 14px;
        min-height: 0;
      }

      .panel {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.04));
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
        min-height: 0;
      }

      .panelHeader {
        padding: 12px 12px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panelHeader .hint {
        font-size: 12px;
        color: var(--muted);
      }

      .list {
        overflow: auto;
        max-height: 100%;
      }

      .group {
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .groupTitle {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: rgba(10, 16, 32, 0.75);
        backdrop-filter: blur(10px);
      }

      .groupTitle .name {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
        font-size: 12px;
      }

      .items {
        padding: 6px;
        display: grid;
        gap: 6px;
      }

      .item {
        padding: 10px 10px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .item:hover {
        background: rgba(255, 255, 255, 0.055);
        border-color: rgba(255, 255, 255, 0.14);
      }

      .item.active {
        background: rgba(125, 211, 252, 0.09);
        border-color: rgba(125, 211, 252, 0.35);
      }

      .item .id {
        font-family: var(--mono);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.78);
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
      }

      .item .title {
        font-size: 13px;
        line-height: 1.25;
        color: rgba(255, 255, 255, 0.9);
      }

      .meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .pill {
        font-family: var(--mono);
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
      }

      .right {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }

      .detail {
        padding: 14px 14px 12px;
        display: grid;
        gap: 10px;
      }

      .detail h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.2px;
      }

      .detail .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .kv {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
        font-size: 12px;
      }

      .kv b {
        color: rgba(255, 255, 255, 0.92);
        font-weight: 600;
        font-family: var(--mono);
      }

      .links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .links .box {
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 14px;
        padding: 10px;
        min-height: 100px;
      }

      .links .boxTitle {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .links .linkList {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .nodeLink {
        font-family: var(--mono);
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.86);
        cursor: pointer;
      }

      .nodeLink:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .graphWrap {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        min-height: 0;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .graphHeader {
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .legend {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }

      .legendItem {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted2);
      }

      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="titleRow">
          <div>
            <h1>AI Agent 知识网络（v0 交互原型）</h1>
            <div class="sub">支持搜索、分类筛选、依赖/被依赖关系浏览、邻域图可视化（选中节点的依赖与被依赖）</div>
          </div>
          <div class="actions">
            <button id="btnRandom">随机跳转</button>
            <button id="btnCopyLink">复制节点链接</button>
            <button id="btnExport">导出 JSON（nodes/edges）</button>
          </div>
        </div>

        <div class="toolbar">
          <div class="search">
            <input id="q" type="search" placeholder="搜索：输入 ID（如 C08）或关键词（如 检索 / 安全 / 评测）" />
          </div>
          <div class="filters" id="filters"></div>
        </div>
      </header>

      <main>
        <section class="panel">
          <div class="panelHeader">
            <div class="hint" id="resultHint">加载中…</div>
            <div class="hint"><span id="selectedHint">未选择</span></div>
          </div>
          <div class="list" id="list"></div>
        </section>

        <section class="panel right">
          <div class="detail" id="detail"></div>
          <div class="graphWrap">
            <div class="graphHeader">
              <div>邻域图（中心=当前节点；内圈=依赖；外圈=被依赖）</div>
              <div class="legend" id="legend"></div>
            </div>
            <svg id="graph" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
        </section>
      </main>
    </div>

      const CATEGORIES = {
        C: { key: "C", name: "概念", color: "#7dd3fc" },
        P: { key: "P", name: "模式", color: "#a78bfa" },
        A: { key: "A", name: "架构", color: "#60a5fa" },
        E: { key: "E", name: "工程化", color: "#34d399" },
        S: { key: "S", name: "安全", color: "#fb7185" },
        V: { key: "V", name: "V-评测", color: "#fbbf24" },
        X: { key: "X", name: "案例", color: "#f472b6" }
      };

      function parseRaw(raw) {
        const lines = raw
          .split("\n")
          .map((l) => l.trim())
          .filter(Boolean);
        const nodes = [];
        for (const line of lines) {
          const [id, title, depsRaw = ""] = line.split("\t");
          if (!id || !title) continue;
          const catKey = id[0];
          const deps = depsRaw
            .split(",")
            .map((s) => s.trim())
            .filter(Boolean);
          nodes.push({ id, title, catKey, deps });
        }
        const byId = new Map(nodes.map((n) => [n.id, n]));
        const edges = [];
        for (const n of nodes) {
          for (const d of n.deps) {
            edges.push({ from: d, to: n.id });
          }
        }
        const dependents = new Map();
        for (const n of nodes) dependents.set(n.id, []);
        for (const e of edges) {
          if (!dependents.has(e.from)) dependents.set(e.from, []);
          dependents.get(e.from).push(e.to);
        }
        return { nodes, edges, byId, dependents };
      }

      const state = {
        q: "",
        enabledCats: new Set(Object.keys(CATEGORIES)),
        selectedId: null
      };

      const data = parseRaw(RAW);

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function catLabel(catKey) {
        return CATEGORIES[catKey]?.name ?? catKey;
      }

      function catColor(catKey) {
        return CATEGORIES[catKey]?.color ?? "#cbd5e1";
      }

      function normalize(s) {
        return String(s).toLowerCase().replaceAll(/\s+/g, "");
      }

      function getFilteredNodes() {
        const q = normalize(state.q);
        const enabled = state.enabledCats;
        const out = [];
        for (const n of data.nodes) {
          if (!enabled.has(n.catKey)) continue;
          if (!q) {
            out.push(n);
            continue;
          }
          const hay = normalize(`${n.id} ${n.title} ${catLabel(n.catKey)}`);
          if (hay.includes(q)) out.push(n);
        }
        return out;
      }

      function groupNodes(nodes) {
        const groups = new Map();
        for (const n of nodes) {
          if (!groups.has(n.catKey)) groups.set(n.catKey, []);
          groups.get(n.catKey).push(n);
        }
        for (const [k, arr] of groups) {
          arr.sort((a, b) => a.id.localeCompare(b.id, "en"));
          groups.set(k, arr);
        }
        return groups;
      }

      function setSelected(id) {
        const node = data.byId.get(id);
        if (!node) return;
        state.selectedId = id;
        location.hash = `#${encodeURIComponent(id)}`;
        render();
      }

      function renderFilters() {
        const el = document.getElementById("filters");
        const parts = [];
        const totalByCat = new Map();
        for (const n of data.nodes) totalByCat.set(n.catKey, (totalByCat.get(n.catKey) || 0) + 1);
        for (const catKey of Object.keys(CATEGORIES)) {
          const info = CATEGORIES[catKey];
          const checked = state.enabledCats.has(catKey) ? "checked" : "";
          const count = totalByCat.get(catKey) || 0;
          parts.push(
            `<label class="chip" style="border-color: rgba(255,255,255,0.14)"><input type="checkbox" data-cat="${info.key}" ${checked} />` +
              `<span class="dot" style="background:${info.color}"></span>` +
              `${escapeHtml(info.name)} <span class="badge">${count}</span></label>`
          );
        }
        el.innerHTML = parts.join("");
        el.querySelectorAll("input[type=checkbox]").forEach((input) => {
          input.addEventListener("change", (e) => {
            const cat = e.target.getAttribute("data-cat");
            if (!cat) return;
            if (e.target.checked) state.enabledCats.add(cat);
            else state.enabledCats.delete(cat);
            render();
          });
        });
      }

      function renderList() {
        const nodes = getFilteredNodes();
        const groups = groupNodes(nodes);
        const order = Object.keys(CATEGORIES);
        const listEl = document.getElementById("list");
        const sections = [];

        for (const catKey of order) {
          const arr = groups.get(catKey) || [];
          if (arr.length === 0) continue;
          const head =
            `<div class="groupTitle"><div class="name">` +
            `<span class="dot" style="background:${catColor(catKey)}"></span>` +
            `${escapeHtml(catLabel(catKey))}</div>` +
            `<span class="badge">${arr.length}</span></div>`;

          const items = arr
            .map((n) => {
              const depCount = n.deps.length;
              const depdCount = (data.dependents.get(n.id) || []).length;
              const active = n.id === state.selectedId ? "active" : "";
              return (
                `<div class="item ${active}" data-id="${escapeHtml(n.id)}">` +
                `<div class="id">${escapeHtml(n.id)}</div>` +
                `<div class="title">${escapeHtml(n.title)}</div>` +
                `<div class="meta">` +
                `<span class="pill">deps:${depCount}</span>` +
                `<span class="pill">usedBy:${depdCount}</span>` +
                `</div>` +
                `</div>`
              );
            })
            .join("");

          sections.push(`<div class="group">${head}<div class="items">${items}</div></div>`);
        }

        listEl.innerHTML = sections.join("");
        listEl.querySelectorAll(".item").forEach((it) => {
          it.addEventListener("click", () => {
            const id = it.getAttribute("data-id");
            if (id) setSelected(id);
          });
        });

        const hintEl = document.getElementById("resultHint");
        hintEl.textContent = `当前显示 ${nodes.length} / ${data.nodes.length} 节点`;
      }

      function buildNodePills(ids) {
        if (!ids || ids.length === 0) return `<span class="hint">无</span>`;
        return ids
          .slice()
          .sort((a, b) => a.localeCompare(b, "en"))
          .map((id) => {
            const n = data.byId.get(id);
            const color = n ? catColor(n.catKey) : "rgba(255,255,255,0.35)";
            const title = n ? `${id} · ${n.title}` : id;
            return `<span class="nodeLink" data-id="${escapeHtml(id)}" title="${escapeHtml(title)}" style="border-color:${color}55">${escapeHtml(
              id
            )}</span>`;
          })
          .join("");
      }

      function renderDetail() {
        const detailEl = document.getElementById("detail");
        const selectedHint = document.getElementById("selectedHint");
        const id = state.selectedId;
        if (!id) {
          selectedHint.textContent = "未选择";
          detailEl.innerHTML =
            `<div class="hint">从左侧点击一个节点，右侧会展示依赖关系与邻域图。</div>` +
            `<div class="hint">小技巧：URL hash 支持直达，例如 <span style="font-family:var(--mono)">#C08</span>。</div>`;
          return;
        }

        const n = data.byId.get(id);
        if (!n) {
          selectedHint.textContent = "未选择";
          detailEl.innerHTML = `<div class="hint">节点不存在：${escapeHtml(id)}</div>`;
          return;
        }

        selectedHint.textContent = `${n.id} · ${catLabel(n.catKey)}`;

        const deps = n.deps.filter((d) => data.byId.has(d));
        const usedBy = (data.dependents.get(n.id) || []).filter((d) => data.byId.has(d));

        const html = `
          <div class="row">
            <h2>${escapeHtml(n.title)}</h2>
          </div>
          <div class="row">
            <span class="kv"><b>${escapeHtml(n.id)}</b></span>
            <span class="kv">分类：<span style="color:${catColor(n.catKey)}">${escapeHtml(catLabel(n.catKey))}</span></span>
            <span class="kv">依赖：${deps.length}</span>
            <span class="kv">被依赖：${usedBy.length}</span>
          </div>
          <div class="links">
            <div class="box">
              <div class="boxTitle"><span>前置依赖</span><span class="badge">${deps.length}</span></div>
              <div class="linkList">${buildNodePills(deps)}</div>
            </div>
            <div class="box">
              <div class="boxTitle"><span>后继（依赖本节点）</span><span class="badge">${usedBy.length}</span></div>
              <div class="linkList">${buildNodePills(usedBy)}</div>
            </div>
          </div>
        `;

        detailEl.innerHTML = html;
        detailEl.querySelectorAll(".nodeLink").forEach((el) => {
          el.addEventListener("click", () => {
            const nid = el.getAttribute("data-id");
            if (nid) setSelected(nid);
          });
        });
      }

      function clearSvg(svg) {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
      }

      function elNS(tag) {
        return document.createElementNS("http://www.w3.org/2000/svg", tag);
      }

      function drawGraph() {
        const svg = document.getElementById("graph");
        clearSvg(svg);
        const id = state.selectedId;
        if (!id) {
          const t = elNS("text");
          t.setAttribute("x", "450");
          t.setAttribute("y", "260");
          t.setAttribute("text-anchor", "middle");
          t.setAttribute("fill", "rgba(255,255,255,0.55)");
          t.setAttribute("font-size", "14");
          t.textContent = "选择一个节点以显示邻域图";
          svg.appendChild(t);
          return;
        }

        const center = data.byId.get(id);
        if (!center) return;

        const deps = center.deps.filter((d) => data.byId.has(d));
        const usedBy = (data.dependents.get(id) || []).filter((d) => data.byId.has(d));
        const maxRing = 14;
        const depsRing = deps.slice(0, maxRing);
        const usedRing = usedBy.slice(0, maxRing);

        const W = 900;
        const H = 520;
        const cx = W / 2;
        const cy = H / 2;
        const r1 = 135;
        const r2 = 245;

        const positions = new Map();
        positions.set(id, { x: cx, y: cy });

        function place(ids, radius, startAngle) {
          const n = ids.length;
          if (n === 0) return;
          const step = (Math.PI * 2) / n;
          for (let i = 0; i < n; i++) {
            const a = startAngle + step * i;
            positions.set(ids[i], { x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius });
          }
        }

        place(depsRing, r1, -Math.PI / 2);
        place(usedRing, r2, Math.PI / 2);

        const defs = elNS("defs");
        const glow = elNS("filter");
        glow.setAttribute("id", "glow");
        const feGaussian = elNS("feGaussianBlur");
        feGaussian.setAttribute("stdDeviation", "3.2");
        feGaussian.setAttribute("result", "coloredBlur");
        const feMerge = elNS("feMerge");
        const feMergeNode1 = elNS("feMergeNode");
        feMergeNode1.setAttribute("in", "coloredBlur");
        const feMergeNode2 = elNS("feMergeNode");
        feMergeNode2.setAttribute("in", "SourceGraphic");
        feMerge.appendChild(feMergeNode1);
        feMerge.appendChild(feMergeNode2);
        glow.appendChild(feGaussian);
        glow.appendChild(feMerge);
        defs.appendChild(glow);
        svg.appendChild(defs);

        const bg = elNS("rect");
        bg.setAttribute("x", "0");
        bg.setAttribute("y", "0");
        bg.setAttribute("width", String(W));
        bg.setAttribute("height", String(H));
        bg.setAttribute("fill", "transparent");
        svg.appendChild(bg);

        function line(x1, y1, x2, y2, color, width, dash) {
          const l = elNS("line");
          l.setAttribute("x1", String(x1));
          l.setAttribute("y1", String(y1));
          l.setAttribute("x2", String(x2));
          l.setAttribute("y2", String(y2));
          l.setAttribute("stroke", color);
          l.setAttribute("stroke-width", String(width));
          l.setAttribute("stroke-linecap", "round");
          l.setAttribute("opacity", "0.7");
          if (dash) l.setAttribute("stroke-dasharray", dash);
          return l;
        }

        function nodeCircle(nodeId, radius) {
          const n = data.byId.get(nodeId);
          const p = positions.get(nodeId);
          if (!p || !n) return null;
          const g = elNS("g");
          g.setAttribute("cursor", "pointer");
          g.addEventListener("click", () => setSelected(nodeId));

          const c = elNS("circle");
          c.setAttribute("cx", String(p.x));
          c.setAttribute("cy", String(p.y));
          c.setAttribute("r", String(radius));
          c.setAttribute("fill", `${catColor(n.catKey)}22`);
          c.setAttribute("stroke", `${catColor(n.catKey)}cc`);
          c.setAttribute("stroke-width", nodeId === id ? "2.5" : "1.4");
          if (nodeId === id) c.setAttribute("filter", "url(#glow)");
          g.appendChild(c);

          const t1 = elNS("text");
          t1.setAttribute("x", String(p.x));
          t1.setAttribute("y", String(p.y - 2));
          t1.setAttribute("text-anchor", "middle");
          t1.setAttribute("fill", "rgba(255,255,255,0.92)");
          t1.setAttribute("font-size", nodeId === id ? "14" : "12");
          t1.setAttribute("font-family", "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace");
          t1.textContent = n.id;
          g.appendChild(t1);

          const t2 = elNS("text");
          t2.setAttribute("x", String(p.x));
          t2.setAttribute("y", String(p.y + 16));
          t2.setAttribute("text-anchor", "middle");
          t2.setAttribute("fill", "rgba(255,255,255,0.62)");
          t2.setAttribute("font-size", "11");
          t2.textContent = catLabel(n.catKey);
          g.appendChild(t2);

          const title = elNS("title");
          title.textContent = `${n.id} · ${n.title}`;
          g.appendChild(title);

          return g;
        }

        for (const d of depsRing) {
          const p1 = positions.get(d);
          const p2 = positions.get(id);
          if (!p1 || !p2) continue;
          svg.appendChild(line(p1.x, p1.y, p2.x, p2.y, "rgba(125,211,252,0.55)", 1.2, "4 6"));
        }

        for (const u of usedRing) {
          const p1 = positions.get(id);
          const p2 = positions.get(u);
          if (!p1 || !p2) continue;
          svg.appendChild(line(p1.x, p1.y, p2.x, p2.y, "rgba(34,197,94,0.55)", 1.35, null));
        }

        const ring1 = elNS("circle");
        ring1.setAttribute("cx", String(cx));
        ring1.setAttribute("cy", String(cy));
        ring1.setAttribute("r", String(r1));
        ring1.setAttribute("fill", "transparent");
        ring1.setAttribute("stroke", "rgba(255,255,255,0.08)");
        ring1.setAttribute("stroke-dasharray", "3 7");
        svg.appendChild(ring1);

        const ring2 = elNS("circle");
        ring2.setAttribute("cx", String(cx));
        ring2.setAttribute("cy", String(cy));
        ring2.setAttribute("r", String(r2));
        ring2.setAttribute("fill", "transparent");
        ring2.setAttribute("stroke", "rgba(255,255,255,0.06)");
        ring2.setAttribute("stroke-dasharray", "2 9");
        svg.appendChild(ring2);

        for (const d of depsRing) {
          const g = nodeCircle(d, 22);
          if (g) svg.appendChild(g);
        }
        for (const u of usedRing) {
          const g = nodeCircle(u, 24);
          if (g) svg.appendChild(g);
        }
        svg.appendChild(nodeCircle(id, 34));

        const overflowDeps = deps.length - depsRing.length;
        const overflowUsed = usedBy.length - usedRing.length;
        const note = [];
        if (overflowDeps > 0) note.push(`依赖还有 ${overflowDeps} 个未展示`);
        if (overflowUsed > 0) note.push(`被依赖还有 ${overflowUsed} 个未展示`);
        if (note.length > 0) {
          const t = elNS("text");
          t.setAttribute("x", "14");
          t.setAttribute("y", "506");
          t.setAttribute("fill", "rgba(255,255,255,0.5)");
          t.setAttribute("font-size", "12");
          t.textContent = note.join("；");
          svg.appendChild(t);
        }
      }

      function renderLegend() {
        const el = document.getElementById("legend");
        const parts = [];
        for (const catKey of Object.keys(CATEGORIES)) {
          parts.push(
            `<span class="legendItem" title="${escapeHtml(CATEGORIES[catKey].name)}">` +
              `<span class="dot" style="background:${catColor(catKey)}"></span>` +
              `${escapeHtml(catKey)}</span>`
          );
        }
        el.innerHTML = parts.join("");
      }

      function render() {
        renderList();
        renderDetail();
        drawGraph();
        document.querySelectorAll(".item").forEach((el) => {
          const id = el.getAttribute("data-id");
          el.classList.toggle("active", id === state.selectedId);
        });
      }

      function selectFromHash() {
        const raw = location.hash.replace(/^#/, "");
        if (!raw) return;
        const id = decodeURIComponent(raw);
        if (data.byId.has(id)) state.selectedId = id;
      }

      function copyToClipboard(text) {
        if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        return Promise.resolve();
      }

      function download(filename, text) {
        const blob = new Blob([text], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function init() {
        renderFilters();
        renderLegend();
        selectFromHash();

        const q = document.getElementById("q");
        q.addEventListener("input", () => {
          state.q = q.value;
          render();
        });

        window.addEventListener("hashchange", () => {
          selectFromHash();
          render();
        });

        document.getElementById("btnRandom").addEventListener("click", () => {
          const visible = getFilteredNodes();
          const pickFrom = visible.length > 0 ? visible : data.nodes;
          const idx = Math.floor(Math.random() * pickFrom.length);
          setSelected(pickFrom[idx].id);
        });

        document.getElementById("btnCopyLink").addEventListener("click", async () => {
          if (!state.selectedId) return;
          const link = `${location.origin}${location.pathname}#${encodeURIComponent(state.selectedId)}`;
          await copyToClipboard(link);
        });

        document.getElementById("btnExport").addEventListener("click", () => {
          const nodes = data.nodes.map((n) => ({ id: n.id, title: n.title, category: catLabel(n.catKey), categoryKey: n.catKey, deps: n.deps }));
          const edges = data.edges.map((e) => ({ from: e.from, to: e.to }));
          download("agent-knowledge-network.json", JSON.stringify({ nodes, edges }, null, 2));
        });

        if (!state.selectedId) state.selectedId = "C11";
        render();
      }

      init();
    </script>
  </body>
</html>
